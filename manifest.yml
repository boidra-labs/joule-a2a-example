# Cloud Foundry manifest — generated by Boidra Platform's install-agent wizard.
# OTEL_EXPORTER_OTLP_ENDPOINT points at this Boidra Platform instance so the agent auto-reports.
applications:
  - name: test-agent
    memory: 512M
    instances: 1
    docker:
      image: REPLACE_WITH_PUSHED_IMAGE   # the CI pipeline sets this via --docker-image
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:5173/otel
      OTEL_SERVICE_NAME: test-agent
      BOIDTELEMETRY_RESOURCE_GROUP: default
